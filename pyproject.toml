[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "on-policy-reverse-distillation"
version = "0.1.0"
description = "Paper-focused implementation of On-Policy Reverse Distillation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "torch>=2.8", "numpy", "pandas", "pyarrow", "datasets", "transformers",
  "accelerate", "hydra-core==1.3.2", "omegaconf", "ray", "tensordict",
  "torchdata", "packaging", "cloudpickle", "psutil", "filelock", "tqdm",
  "einops", "codetiming", "dill", "pillow", "pyyaml", "huggingface-hub",
  "math-verify==0.8.0", "sympy", "pylatexenc", "peft", "wandb"
]

[project.optional-dependencies]
train = ["vllm==0.21.0", "qwen-vl-utils", "liger-kernel"]
dev = ["ruff", "build"]

[tool.setuptools.packages.find]
include = ["oprd*", "verl*", "data*"]

[tool.setuptools.package-data]
oprd = ["agent/*.json", "agent/*.yaml", "code/*.json"]
data = ["*.json"]
verl = ["version/*", "**/*.yaml", "**/*.jinja", "**/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
